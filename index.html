<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIW Multi Account Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="grid-container grid-4" id="main-grid">
        <!-- Conta 1 -->
        <div class="panel-wrapper" id="panel-1">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title-area">
                        <span class="panel-title">Conta 1</span>
                        <input type="text" class="login-input login-email" placeholder="Email / Usuário" data-acc="1">
                        <input type="password" class="login-input login-password" placeholder="Senha" data-acc="1">
                        <div class="login-info-tooltip" title="Auto-Login: Preencha com seus dados. O aplicativo irá logar automaticamente sempre que o jogo recarregar.">
                            <i data-lucide="info" width="14" height="14"></i>
                        </div>
                    </div>
                    <div class="header-controls">
                        <button class="clear-cache-btn" data-target="webview-1" title="Limpar Cache"><i data-lucide="trash-2" width="16" height="16"></i></button>
                        <button class="refresh-btn" data-target="webview-1" title="Atualizar"><i data-lucide="refresh-cw" width="16" height="16"></i></button>
                        <button class="zoom-btn zoom-out" data-target="webview-1" title="Diminuir Zoom"><i data-lucide="zoom-out" width="16" height="16"></i></button>
                        <button class="zoom-btn zoom-in" data-target="webview-1" title="Aumentar Zoom"><i data-lucide="zoom-in" width="16" height="16"></i></button>
                        <button class="maximize-btn" data-target="panel-1" title="Maximizar"><i data-lucide="maximize" width="16" height="16"></i></button>
                        <button class="close-btn" data-target="panel-1" data-id="1" title="Fechar Conta"><i data-lucide="x" width="16" height="16"></i></button>
                    </div>
                </div>
                <webview id="webview-1" src="https://poke.idleworld.online/login" partition="persist:conta1" allowpopups></webview>
            </div>
        </div>
        
        <!-- Conta 2 -->
        <div class="panel-wrapper" id="panel-2">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title-area">
                        <span class="panel-title">Conta 2</span>
                        <input type="text" class="login-input login-email" placeholder="Email / Usuário" data-acc="2">
                        <input type="password" class="login-input login-password" placeholder="Senha" data-acc="2">
                        <div class="login-info-tooltip" title="Auto-Login: Preencha com seus dados. O aplicativo irá logar automaticamente sempre que o jogo recarregar.">
                            <i data-lucide="info" width="14" height="14"></i>
                        </div>
                    </div>
                    <div class="header-controls">
                        <button class="clear-cache-btn" data-target="webview-2" title="Limpar Cache"><i data-lucide="trash-2" width="16" height="16"></i></button>
                        <button class="refresh-btn" data-target="webview-2" title="Atualizar"><i data-lucide="refresh-cw" width="16" height="16"></i></button>
                        <button class="zoom-btn zoom-out" data-target="webview-2" title="Diminuir Zoom"><i data-lucide="zoom-out" width="16" height="16"></i></button>
                        <button class="zoom-btn zoom-in" data-target="webview-2" title="Aumentar Zoom"><i data-lucide="zoom-in" width="16" height="16"></i></button>
                        <button class="maximize-btn" data-target="panel-2" title="Maximizar"><i data-lucide="maximize" width="16" height="16"></i></button>
                        <button class="close-btn" data-target="panel-2" data-id="2" title="Fechar Conta"><i data-lucide="x" width="16" height="16"></i></button>
                    </div>
                </div>
                <webview id="webview-2" src="https://poke.idleworld.online/login" partition="persist:conta2" allowpopups></webview>
            </div>
        </div>
        
        <!-- Conta 3 -->
        <div class="panel-wrapper" id="panel-3">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title-area">
                        <span class="panel-title">Conta 3</span>
                        <input type="text" class="login-input login-email" placeholder="Email / Usuário" data-acc="3">
                        <input type="password" class="login-input login-password" placeholder="Senha" data-acc="3">
                        <div class="login-info-tooltip" title="Auto-Login: Preencha com seus dados. O aplicativo irá logar automaticamente sempre que o jogo recarregar.">
                            <i data-lucide="info" width="14" height="14"></i>
                        </div>
                    </div>
                    <div class="header-controls">
                        <button class="clear-cache-btn" data-target="webview-3" title="Limpar Cache"><i data-lucide="trash-2" width="16" height="16"></i></button>
                        <button class="refresh-btn" data-target="webview-3" title="Atualizar"><i data-lucide="refresh-cw" width="16" height="16"></i></button>
                        <button class="zoom-btn zoom-out" data-target="webview-3" title="Diminuir Zoom"><i data-lucide="zoom-out" width="16" height="16"></i></button>
                        <button class="zoom-btn zoom-in" data-target="webview-3" title="Aumentar Zoom"><i data-lucide="zoom-in" width="16" height="16"></i></button>
                        <button class="maximize-btn" data-target="panel-3" title="Maximizar"><i data-lucide="maximize" width="16" height="16"></i></button>
                        <button class="close-btn" data-target="panel-3" data-id="3" title="Fechar Conta"><i data-lucide="x" width="16" height="16"></i></button>
                    </div>
                </div>
                <webview id="webview-3" src="https://poke.idleworld.online/login" partition="persist:conta3" allowpopups></webview>
            </div>
        </div>
        
        <!-- Conta 4 -->
        <div class="panel-wrapper" id="panel-4">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title-area">
                        <span class="panel-title">Conta 4</span>
                        <input type="text" class="login-input login-email" placeholder="Email / Usuário" data-acc="4">
                        <input type="password" class="login-input login-password" placeholder="Senha" data-acc="4">
                        <div class="login-info-tooltip" title="Auto-Login: Preencha com seus dados. O aplicativo irá logar automaticamente sempre que o jogo recarregar.">
                            <i data-lucide="info" width="14" height="14"></i>
                        </div>
                    </div>
                    <div class="header-controls">
                        <button class="clear-cache-btn" data-target="webview-4" title="Limpar Cache"><i data-lucide="trash-2" width="16" height="16"></i></button>
                        <button class="refresh-btn" data-target="webview-4" title="Atualizar"><i data-lucide="refresh-cw" width="16" height="16"></i></button>
                        <button class="zoom-btn zoom-out" data-target="webview-4" title="Diminuir Zoom"><i data-lucide="zoom-out" width="16" height="16"></i></button>
                        <button class="zoom-btn zoom-in" data-target="webview-4" title="Aumentar Zoom"><i data-lucide="zoom-in" width="16" height="16"></i></button>
                        <button class="maximize-btn" data-target="panel-4" title="Maximizar"><i data-lucide="maximize" width="16" height="16"></i></button>
                        <button class="close-btn" data-target="panel-4" data-id="4" title="Fechar Conta"><i data-lucide="x" width="16" height="16"></i></button>
                    </div>
                </div>
                <webview id="webview-4" src="https://poke.idleworld.online/login" partition="persist:conta4" allowpopups></webview>
            </div>
        </div>
    </div>

    <!-- IV Toggle Button -->
    <button id="iv-toggle-btn" title="Abrir Calculadora de IV">
        <i data-lucide="calculator" width="24" height="24"></i>
    </button>

    <!-- IV Calculator Panel -->
    <div id="iv-panel" class="hidden">
        <div class="iv-header">
            <img id="iv-sprite" src="" alt="Sprite" style="display: none;">
            <div class="iv-title-box">
                <div class="iv-name-row">
                    <span id="iv-name">Pokémon</span>
                    <span id="iv-account-name">Conta</span>
                </div>
                <div id="iv-types" class="iv-types-container"></div>
            </div>
            <div class="iv-header-actions">
                <div class="iv-info-tooltip" title="Dica: Passe o mouse sobre qualquer Pokémon dentro da bag ou chat no jogo para preencher esta calculadora automaticamente!">
                    <i data-lucide="info" width="16" height="16"></i>
                </div>
                <button id="iv-close-btn"><i data-lucide="x" width="16" height="16"></i></button>
            </div>
        </div>

        <div class="iv-top-stats">
            <div class="iv-box">
                <label>NÍVEL</label>
                <input type="number" id="iv-inp-nivel" value="1">
            </div>
            <div class="iv-box">
                <label>QUALIDADE</label>
                <input type="number" step="0.01" id="iv-inp-qualidade" value="1.0">
            </div>
            <div class="iv-box">
                <label>IV TOTAL</label>
                <div style="position:relative;">
                    <input type="text" id="iv-val-total" value="0" style="padding-right: 32px;">
                    <span style="position:absolute; right:6px; top:6px; color:#8b949e; font-size:11px; font-weight:normal; pointer-events:none;">/192</span>
                </div>
            </div>
            <div class="iv-box">
                <label>PODER</label>
                <input type="text" id="iv-val-poder" value="0">
            </div>
        </div>

        <div class="iv-potential-box">
            <div class="iv-ring-wrapper">
                <div class="iv-ring" id="iv-ring">
                    <span id="iv-ring-txt">0%</span>
                </div>
            </div>
            <div class="iv-potential-info">
                <strong id="iv-pot-title">Normal</strong>
                <p id="iv-pot-desc">Captura a tela...</p>
            </div>
        </div>

        <div class="iv-section-title">
            ATRIBUTOS E IV POR STAT <span class="iv-sec-desc" id="iv-sec-desc"></span>
        </div>

        <div class="iv-stats-grid">
            <!-- HP -->
            <div class="iv-stat-card">
                <div class="iv-stat-head">
                    <span class="iv-stat-name iv-color-hp">HP</span>
                    <span class="iv-stat-val"><span id="iv-hp-val" class="iv-color-hp">0.0</span>/32</span>
                </div>
                <div class="iv-progress-bar"><div id="iv-hp-bar" class="iv-bg-hp" style="width: 0%"></div></div>
                <div class="iv-stat-inp-row"><label>atual</label><input type="number" id="iv-inp-hp-atual" value="0"></div>
                <div class="iv-stat-inp-row"><label>base</label><input type="number" id="iv-inp-hp-base" value="0"></div>
            </div>
            <!-- ATK -->
            <div class="iv-stat-card">
                <div class="iv-stat-head">
                    <span class="iv-stat-name iv-color-atk">ATK</span>
                    <span class="iv-stat-val"><span id="iv-atk-val" class="iv-color-atk">0.0</span>/32</span>
                </div>
                <div class="iv-progress-bar"><div id="iv-atk-bar" class="iv-bg-atk" style="width: 0%"></div></div>
                <div class="iv-stat-inp-row"><label>atual</label><input type="number" id="iv-inp-atk-atual" value="0"></div>
                <div class="iv-stat-inp-row"><label>base</label><input type="number" id="iv-inp-atk-base" value="0"></div>
            </div>
            <!-- DEF -->
            <div class="iv-stat-card">
                <div class="iv-stat-head">
                    <span class="iv-stat-name iv-color-def">DEF</span>
                    <span class="iv-stat-val"><span id="iv-def-val" class="iv-color-def">0.0</span>/32</span>
                </div>
                <div class="iv-progress-bar"><div id="iv-def-bar" class="iv-bg-def" style="width: 0%"></div></div>
                <div class="iv-stat-inp-row"><label>atual</label><input type="number" id="iv-inp-def-atual" value="0"></div>
                <div class="iv-stat-inp-row"><label>base</label><input type="number" id="iv-inp-def-base" value="0"></div>
            </div>
            <!-- SPA -->
            <div class="iv-stat-card">
                <div class="iv-stat-head">
                    <span class="iv-stat-name iv-color-spa">SPA</span>
                    <span class="iv-stat-val"><span id="iv-spa-val" class="iv-color-spa">0.0</span>/32</span>
                </div>
                <div class="iv-progress-bar"><div id="iv-spa-bar" class="iv-bg-spa" style="width: 0%"></div></div>
                <div class="iv-stat-inp-row"><label>atual</label><input type="number" id="iv-inp-spa-atual" value="0"></div>
                <div class="iv-stat-inp-row"><label>base</label><input type="number" id="iv-inp-spa-base" value="0"></div>
            </div>
            <!-- SPD -->
            <div class="iv-stat-card">
                <div class="iv-stat-head">
                    <span class="iv-stat-name iv-color-spd">SPD</span>
                    <span class="iv-stat-val"><span id="iv-spd-val" class="iv-color-spd">0.0</span>/32</span>
                </div>
                <div class="iv-progress-bar"><div id="iv-spd-bar" class="iv-bg-spd" style="width: 0%"></div></div>
                <div class="iv-stat-inp-row"><label>atual</label><input type="number" id="iv-inp-spd-atual" value="0"></div>
                <div class="iv-stat-inp-row"><label>base</label><input type="number" id="iv-inp-spd-base" value="0"></div>
            </div>
            <!-- VEL -->
            <div class="iv-stat-card">
                <div class="iv-stat-head">
                    <span class="iv-stat-name iv-color-vel">VEL</span>
                    <span class="iv-stat-val"><span id="iv-vel-val" class="iv-color-vel">0.0</span>/32</span>
                </div>
                <div class="iv-progress-bar"><div id="iv-vel-bar" class="iv-bg-vel" style="width: 0%"></div></div>
                <div class="iv-stat-inp-row"><label>atual</label><input type="number" id="iv-inp-vel-atual" value="0"></div>
                <div class="iv-stat-inp-row"><label>base</label><input type="number" id="iv-inp-vel-base" value="0"></div>
            </div>
        </div>

        <div class="iv-section-title">
            <i data-lucide="swords" width="12" height="12"></i> GOLPES
        </div>
        <div id="iv-moves-list" class="iv-moves-list">
            <!-- Moves rendered here -->
        </div>

        <div class="iv-footer">
            <span class="iv-footer-hint">edite qualquer campo pra recalcular</span>
        </div>
    </div>
    <div id="max-nav-left" class="max-nav-arrow" title="Conta Anterior" style="display: none;">
        <i data-lucide="chevron-left" width="48" height="48"></i>
    </div>
    <div id="max-nav-right" class="max-nav-arrow" title="Próxima Conta" style="display: none;">
        <i data-lucide="chevron-right" width="48" height="48"></i>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="script.js"></script>
    <script src="iv-manager.js"></script>
    <script src="login-manager.js"></script>
</body>
</html>
